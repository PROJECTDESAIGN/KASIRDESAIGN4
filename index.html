      /*
       * Dipanggil oleh onerror setiap kali CDN utama gagal. Sumber cadangan
       * disimpan pada data-fallbacks dan dicoba satu per satu.
       */
      window.__dwisyaCdnFallback = function (script) {
        var label = script.getAttribute('data-cdn-label') || script.src;
        var sources = (script.getAttribute('data-fallbacks') || '')
          .split('|')
          .filter(Boolean);
        var attempt = Number(script.getAttribute('data-cdn-attempt') || 0);
        failedSources[label] = failedSources[label] || [];
        failedSources[label].push(script.src);

        if (attempt < sources.length) {
          script.setAttribute('data-cdn-attempt', String(attempt + 1));
          console.warn('[CDN] Sumber utama gagal untuk ' + label + '; mencoba cadangan ' + (attempt + 1) + '.');
          script.src = sources[attempt];
          return;
        }

        script.setAttribute('data-cdn-failed', 'true');
        console.error('[CDN] Semua sumber gagal untuk ' + label + ':', failedSources[label]);
        if (label === 'Tailwind') window.__dwisyaTailwindFailed = true;
      };

      window.__dwisyaCdnGuardTimer = window.setTimeout(function () {
        var missing = [];
        if (!window.React) missing.push('React');

    function rp(n) {
      const num = Number(n || 0);
      return 'Rp ' + num.toLocaleString('id-ID');
    }

    function fmtDate(iso, withTime = false) {
      if (!iso) return '-';
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        const pad = (v) => (v < 10 ? '0' + v : String(v));
        let base = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
        if (withTime) {
          base += ` ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        return base;
      } catch {
        return iso;
      }
    }

    function cleanWaInput(val) {
      let v = String(val || '').replace(/\D/g, '');
      if (v.startsWith('0')) {
        v = '62' + v.slice(1);
      }
      return v;
    }

          let w = img.width;
          let h = img.height;
          if (w > h) {
            if (w > MAX) {
              h = Math.round((h * MAX) / w);
              w = MAX;
            }
          } else {
            if (h > MAX) {
              w = Math.round((w * MAX) / h);
              h = MAX;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.drawImage(img, 0, 0, w, h);
            callback(canvas.toDataURL('image/jpeg', 0.7));
          } else {
            callback(e.target.result);
          }
        };
        img.src = e.target.result;
      };

      }, []);

      const displayedProducts = useMemo(() => {
        return products.filter((p) => {
          // Paksa semua nilai jadi string agar tidak crash jika Sheets kirim Date/number
          const status = String(p.STATUS || '').trim().toLowerCase();
          const isShown = status !== 'disembunyikan';
          const nama = String(p.NAMA || '').toLowerCase();
          const deskripsi = String(p.DESKRIPSI || '').toLowerCase();
          const q = searchQuery.toLowerCase();
          const matchSearch = nama.includes(q) || deskripsi.includes(q);
          return isShown && matchSearch;
        });
      }, [products, searchQuery]);

      // Fingerprint berubah ketika cache diganti hasil server, produk baru
      // masuk, atau urutan produk berubah. Setiap versi data selalu memulai
      // antrean baru sehingga hasil cache tidak pernah tiba-tiba tampil semua.
      const productDataKey = useMemo(() => {
        return displayedProducts.map((p, index) =>
          String(p.ID || p.NAMA || index)
        ).join('|');
      }, [displayedProducts]);

      // Reset visible count saat query atau versi data berubah.
      useEffect(() => {
        setRevealedDataKey(productDataKey);
        setVisibleCount(Math.min(INITIAL_BATCH_SIZE, displayedProducts.length));
      }, [searchQuery, productDataKey]);

      // Munculkan produk bertahap, baik data berasal dari cache maupun API.
      useEffect(() => {
        if (displayedProducts.length === 0) return;
        if (visibleCount >= displayedProducts.length) return;
        const timer = setTimeout(() => {
          setVisibleCount((prev) =>
            Math.min(prev + REVEAL_STEP, displayedProducts.length)
          );
        }, REVEAL_DELAY_MS);
        return () => clearTimeout(timer);
      }, [visibleCount, productDataKey]);

      const handlePesanWa = (p) => {
        const text = `Halo Admin Dwisyafitriproject, saya ingin memesan produk:\n*${p.NAMA}* (${rp(p.HARGA)})\nApakah stok tersedia? Terima kasih!`;
        window.open(`https://wa.me/6288289369002?text=${encodeURIComponent(text)}`, '_blank');
      };

      // Saat data baru masuk, tahan daftar pada skeleton sampai effect reset
      // selesai. Ini mencegah seluruh produk cache/server terlukis satu frame.
      const effectiveVisibleCount =
        initialLoadingFinished && revealedDataKey === productDataKey
          ? visibleCount
          : 0;
      const visibleProducts = displayedProducts.slice(0, effectiveVisibleCount);
      const remainingCount = displayedProducts.length - effectiveVisibleCount;

      return (
        <div className="max-w-7xl mx-auto px-4 py-6 w-full">
          <div className="bg-[#FFDD00] neo-border neo-shadow-lg p-6 mb-8 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 className="font-black text-2xl md:text-3xl uppercase tracking-tight">Katalog Produk Pilihan</h2>
              <p className="font-bold text-sm text-gray-800 mt-1">Temukan produk terbaik kami dengan harga ramah kantong.</p>
            </div>
            <div className="w-full md:w-72">
              <input
                type="text"
                placeholder="Cari produk..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full neo-border px-3 py-2 text-sm bg-white font-bold outline-none focus:neo-shadow"
              />
            </div>
          </div>

          {isLoading && displayedProducts.length === 0 ? (
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
              {Array.from({ length: INITIAL_BATCH_SIZE }).map((_, i) => (
                <div key={i} className="skeleton-card" />
              ))}
            </div>
          ) : displayedProducts.length === 0 ? (
            <div className="text-center py-12 bg-white neo-border p-8">
              <p className="font-extrabold text-lg text-gray-500 mb-4">Tidak ada produk ditemukan.</p>
              {!searchQuery && onReload && (
                <button
                  onClick={onReload}
                  className="mt-2 px-5 py-2 bg-[#FFDD00] neo-border neo-shadow-sm font-extrabold text-sm hover:bg-yellow-400"
                >
                  🔄 Muat Ulang Produk
                </button>
              )}
            </div>
          ) : (
            <>
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                {visibleProducts.map((p, idx) => (
                  <div
                    key={String(p.ID || idx)}
                    className="produk-card-anim"
                    style={{ animationDelay: `${Math.min(idx, INITIAL_BATCH_SIZE - 1) * 60}ms` }}
                  >
                    <CatalogProductCard
                      product={p}
                      onSelectDetail={(prod) => setSelectedProduct(prod)}
                      onPesanWa={handlePesanWa}
                    />
                  </div>
                ))}
                {remainingCount > 0 && Array.from({ length: Math.min(remainingCount, 4) }).map((_, i) => (
                  <div key={`sk-${i}`} className="skeleton-card" />
                ))}
              </div>
              {remainingCount > 0 && (
                <p className="text-center text-xs font-bold text-gray-500 mt-4">
                  Memuat {remainingCount} produk lainnya...
                </p>
              )}
            </>
          )}

          {selectedProduct && (
            <ProductDetailModal
              product={selectedProduct}
              onClose={() => setSelectedProduct(null)}
              onPesanWa={handlePesanWa}
            />
          )}
        </div>
      );
    }

    function AdminLogin({ isOpen, onClose, onLoginSuccess, showToast }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      // Pesan error inline di dalam form agar langsung terlihat pengguna
      const [loginError, setLoginError] = useState('');

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');
        setIsLoading(true);
        try {
          const res = await gasCall('loginAdmin', { username, password });
          if (res && res.ok) {
            showToast('Login Admin berhasil!', 'success');
            setLoginError('');
            onLoginSuccess();
            onClose();
          } else {
            // Tampilkan peringatan inline DI DALAM form, bukan hanya toast
            const msg = res?.message || 'Username atau password salah!';
            setLoginError(msg);
            showToast(msg, 'error');

          setIsLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">

    function AdminKasirTab({ products, sales, onSaveSale, onDeleteSale, onShowReceipt }) {
      const [editingId, setEditingId] = useState(null);
      const [nama, setNama] = useState('');
      const [wa, setWa] = useState('');
      const [cart, setCart] = useState([]);
      const [selectedProduct, setSelectedProduct] = useState('');
      const [metode, setMetode] = useState('Cash');
      const [bayar, setBayar] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const totalHarga = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.harga * item.qty, 0);
      }, [cart]);

      const handleAddProductToCart = (prodName) => {
        if (!prodName) return;
        const prod = products.find((x) => x.NAMA === prodName);
        if (!prod) return;

        setCart((prev) => {
          const existing = prev.find((x) => x.nama === prod.NAMA);
          if (existing) {
            return prev.map((x) =>
              x.nama === prod.NAMA ? { ...x, qty: x.qty + 1 } : x
            );
          }
          return [...prev, { nama: prod.NAMA, harga: prod.HARGA, qty: 1 }];
        });
        setSelectedProduct('');
      };

      const handleUpdateQty = (namaProd, delta) => {
        setCart((prev) =>
          prev
            .map((x) => {
              if (x.nama === namaProd) {
                const newQty = x.qty + delta;
                return newQty > 0 ? { ...x, qty: newQty } : null;
              }
              return x;
            })
            .filter(Boolean)
        );
      };

      const handleRemoveFromCart = (namaProd) => {
        setCart((prev) => prev.filter((x) => x.nama !== namaProd));
      };

      const handleMetodeChange = (e) => {
        const val = e.target.value;
        setMetode(val);
        if (val !== 'Cash') {
          setBayar(totalHarga);
        } else {
          setBayar('');
        }
      };

      const currentBayarNum = bayar === '' ? (metode === 'Cash' ? 0 : totalHarga) : Number(bayar);
      const kembalian = metode === 'Cash' ? Math.max(0, currentBayarNum - totalHarga) : 0;

      const handleResetForm = () => {
        setEditingId(null);
        setNama('');
        setWa('');
        setCart([]);
        setSelectedProduct('');
        setMetode('Cash');
        setBayar('');
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!nama.trim() || cart.length === 0 || totalHarga <= 0) return;
        if (metode === 'Cash' && currentBayarNum < totalHarga) return;

        const produkSummary = cart.map((i) => `${i.nama} (${i.qty}x)`).join(', ');

        setIsSubmitting(true);
        try {
          const savedSale = await onSaveSale({
            ID: editingId || undefined,
            NAMA_PEMBELI: nama.trim(),
            WHATSAPP: cleanWaInput(wa),
            PRODUK: produkSummary,
            HARGA: totalHarga,
            BAYAR: currentBayarNum,
            METODE: metode,
            KEMBALIAN: kembalian,
            TANGGAL: new Date().toISOString(),
          });
          handleResetForm();
          if (savedSale) {
            onShowReceipt(savedSale);
          }
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div className="bg-white neo-border neo-shadow p-6 h-fit">
            <h3 className="font-black text-lg mb-4 border-b-2 border-black pb-2">Input Penjualan Kasir</h3>
            
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold uppercase mb-1">Nama Pembeli *</label>
                <input
                  type="text"
                  required
                  value={nama}
                  onChange={(e) => setNama(e.target.value)}
                  placeholder="Pelanggan Umum "
                  className="w-full neo-border px-3 py-2 text-sm bg-white font-bold outline-none focus:neo-shadow"
                />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase mb-1">No. WhatsApp</label>
                <input
                  type="text"
                  value={wa}
                  onChange={(e) => setWa(e.target.value)}
                  placeholder="08xx-xxx-xxx"
                  className="w-full neo-border px-3 py-2 text-sm bg-white font-bold outline-none focus:neo-shadow"
                />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase mb-1">Pilih Produk *</label>
                <div className="flex gap-2">
                  <select
                    value={selectedProduct}
                    onChange={(e) => setSelectedProduct(e.target.value)}
                    className="flex-1 neo-border px-3 py-2 text-sm bg-white font-bold outline-none focus:neo-shadow"
                  >
                    <option value="">-- Pilih Produk --</option>
                    {products.map((p) => (
                      <option key={p.ID} value={p.NAMA}>
                        {p.NAMA} ({rp(p.HARGA)})
                      </option>
                    ))}
                  </select>
                  <button
                    type="button"
                    onClick={() => handleAddProductToCart(selectedProduct)}
                    disabled={!selectedProduct}
                    className="bg-[#FFDD00] neo-border px-3 py-2 text-xs font-extrabold hover:bg-yellow-400 disabled:opacity-50"
                  >
                    + Tambah
                  </button>
                </div>
              </div>

              <div className="neo-border p-3 bg-gray-50 flex flex-col gap-2">
                <div className="text-xs font-bold uppercase tracking-wider border-b pb-1 flex justify-between">
                  <span>Daftar Pesanan ({cart.length})</span>
                  {cart.length > 0 && (
                    <button type="button" onClick={() => setCart([])} className="text-[10px] text-red-600 hover:underline">
                      Kosongkan
                    </button>
                  )}
                </div>

                {cart.length === 0 ? (
                  <div className="text-xs text-gray-500 italic py-2 text-center">
                    Belum ada produk dipilih.
                  </div>
                ) : (
                  <div className="flex flex-col gap-2 max-h-48 overflow-y-auto pr-1">
                    {cart.map((item) => (
                      <div key={item.nama} className="flex items-center justify-between bg-white neo-border p-2 text-xs">
                        <div className="flex-1 pr-2">
                          <div className="font-bold">{item.nama}</div>
                          <div className="text-[11px] text-gray-500 font-mono">
                            {rp(item.harga)} x {item.qty} = {rp(item.harga * item.qty)}
                          </div>
                        </div>
                        <div className="flex items-center gap-1">
                          <button
                            type="button"
                            onClick={() => handleUpdateQty(item.nama, -1)}
                            className="w-5 h-5 bg-gray-200 neo-border font-bold flex items-center justify-center hover:bg-gray-300"
                          >
                            -
                          </button>
                          <span className="w-5 text-center font-bold font-mono">{item.qty}</span>
                          <button
                            type="button"
                            onClick={() => handleUpdateQty(item.nama, 1)}
                            className="w-5 h-5 bg-gray-200 neo-border font-bold flex items-center justify-center hover:bg-gray-300"
                          >
                            +
                          </button>
                          <button
                            type="button"
                            onClick={() => handleRemoveFromCart(item.nama)}
                            className="ml-1 text-red-600 font-bold px-1"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div>
                <label className="block text-xs font-bold uppercase mb-1">Total Tagihan (Rp)</label>
                <input
                  type="text"
                  readOnly
                  value={rp(totalHarga)}
                  className="w-full neo-border px-3 py-2 text-sm bg-yellow-100 font-mono font-extrabold outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase mb-1">Metode Pembayaran</label>
                <select
                  value={metode}
                  onChange={handleMetodeChange}
                  className="w-full neo-border px-3 py-2 text-sm bg-white font-bold outline-none focus:neo-shadow"
                >
                  <option value="Cash">Cash / Tunai</option>
                  <option value="QRIS">QRIS</option>
                  <option value="Transfer">Transfer Bank</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold uppercase mb-1">Uang Diterima (Rp)</label>
                <input
                  type="number"
                  readOnly={metode !== 'Cash'}
                  value={bayar}
                  onChange={(e) => setBayar(e.target.value === '' ? '' : Number(e.target.value))}
                  placeholder={metode === 'Cash' ? '0' : String(totalHarga)}
                  className="w-full neo-border px-3 py-2 text-sm font-mono font-bold outline-none focus:neo-shadow bg-white"
                />
              </div>

              <div className="bg-black text-white p-3 neo-border flex justify-between items-center">
                <span className="text-xs font-bold uppercase">Kembalian:</span>
                <span className="font-mono font-extrabold text-base text-[#00E5FF]">{rp(kembalian)}</span>
              </div>

              <button
                type="submit"
                disabled={isSubmitting || cart.length === 0}
                className="w-full bg-[#FFDD00] neo-border neo-shadow py-2.5 text-xs font-extrabold hover:bg-yellow-400 disabled:opacity-50"
              >
                {isSubmitting ? 'Proses...' : 'Simpan & Cetak Struk'}
              </button>
            </form>
          </div>

          <div className="lg:col-span-2">
            <div className="bg-white neo-border neo-shadow overflow-x-auto">
              <table className="w-full text-left text-xs border-collapse">
                <thead>
                  <tr className="bg-black text-white font-bold uppercase">
                    <th className="p-3">Trx / Tanggal</th>
                    <th className="p-3">Pembeli</th>
                    <th className="p-3">Produk</th>
                    <th className="p-3">Total</th>
                    <th className="p-3 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-200 font-medium">
                  {sales.length === 0 ? (
                    <tr>
                      <td colSpan={5} className="p-4 text-center text-gray-400">Belum ada transaksi.</td>
                    </tr>
                  ) : (
                    sales.map((s) => (
                      <tr key={s.ID} className="hover:bg-gray-50">
                        <td className="p-3 font-mono">
                          <div className="font-bold">{s.NO_TRANSAKSI || s.ID}</div>
                          <div className="text-[10px] text-gray-500">{fmtDate(s.TANGGAL, true)}</div>
                        </td>
                        <td className="p-3 font-bold">{s.NAMA_PEMBELI}</td>
                        <td className="p-3">{s.PRODUK}</td>
                        <td className="p-3 font-mono font-bold">{rp(s.HARGA)}</td>
                        <td className="p-3 text-center space-x-2">
                          <button
                            onClick={() => onShowReceipt(s)}
                            className="neo-border px-2 py-1 bg-[#00E5FF] font-bold hover:bg-cyan-300"
                          >
                            Struk
                          </button>
                          <button
                            onClick={() => onDeleteSale(s.ID)}
                            className="neo-border px-2 py-1 bg-red-400 text-white font-bold hover:bg-red-500"
                          >
                            Hapus
                          </button>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function AdminArusCashTab({ sales, expenses, onSaveExpense, onDeleteExpense }) {
      const [selectedMonth, setSelectedMonth] = useState('Semua Bulan');
      const [formKeterangan, setFormKeterangan] = useState('');
      const [formJumlah, setFormJumlah] = useState('');
      const [formTanggal, setFormTanggal] = useState(() => new Date().toISOString().split('T')[0]);
      const [editingExpenseId, setEditingExpenseId] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);

      const monthOptions = useMemo(() => {
        const set = new Set([
          'Semua Bulan',
          'Mei 2025',
          'April 2025',
          'Maret 2025',
          ...sales.map((s) => getMonthYearStr(s.TANGGAL)).filter(Boolean),
          ...expenses.map((e) => getMonthYearStr(e.TANGGAL)).filter(Boolean),
        ]);
        return Array.from(set);
      }, [sales, expenses]);

      const displaySales = useMemo(() => {
        if (!selectedMonth || selectedMonth === 'Semua Bulan') return sales;
        return sales.filter((s) => getMonthYearStr(s.TANGGAL) === selectedMonth);
      }, [sales, selectedMonth]);

      const displayExpenses = useMemo(() => {
        if (!selectedMonth || selectedMonth === 'Semua Bulan') return expenses;
        return expenses.filter((e) => getMonthYearStr(e.TANGGAL) === selectedMonth);
      }, [expenses, selectedMonth]);

      const totalOmzet = useMemo(() => {
        return displaySales.reduce((sum, s) => sum + (Number(s.HARGA) || 0), 0);
      }, [displaySales]);

      const totalPengeluaran = useMemo(() => {
        return displayExpenses.reduce((sum, e) => sum + (Number(e.JUMLAH) || 0), 0);
      }, [displayExpenses]);

      const cashBersih = totalOmzet - totalPengeluaran;

      const runwayPercentage = totalPengeluaran > 0 ? Math.min(100, Math.round((totalOmzet / totalPengeluaran) * 100)) : 100;

      const expenseMonthsSet = new Set(
        displayExpenses.map((e) => {
          if (!e.TANGGAL) return 'default';
          const d = new Date(e.TANGGAL);
          return isNaN(d.getTime()) ? 'default' : `${d.getFullYear()}-${d.getMonth() + 1}`;
        })
      );
      const distinctExpenseMonths = Math.max(1, expenseMonthsSet.size);

      const monthlyExpense = selectedMonth && selectedMonth !== 'Semua Bulan'
        ? totalPengeluaran
        : totalPengeluaran > 0 ? totalPengeluaran / distinctExpenseMonths : 0;

      const monthsRunway = monthlyExpense > 0 && cashBersih > 0
        ? (cashBersih / monthlyExpense).toFixed(1)
        : totalPengeluaran === 0 && totalOmzet > 0 ? '∞' : '0.0';

      const netProfitMargin = totalOmzet > 0
        ? ((cashBersih / totalOmzet) * 100).toFixed(1)
        : '0.0';

      const expenseRatio = totalOmzet > 0
        ? Math.round((totalPengeluaran / totalOmzet) * 100)
        : (totalPengeluaran > 0 ? 100 : 0);

      const handleEditExpense = (exp) => {
        setEditingExpenseId(exp.ID);
        setFormKeterangan(exp.KETERANGAN || '');
        setFormJumlah(exp.JUMLAH ? String(exp.JUMLAH) : '');
        setFormTanggal(exp.TANGGAL ? new Date(exp.TANGGAL).toISOString().split('T')[0] : new Date().toISOString().split('T')[0]);
      };

      const handleResetExpense = () => {
        setEditingExpenseId(null);
        setFormKeterangan('');
        setFormJumlah('');
        setFormTanggal(new Date().toISOString().split('T')[0]);
      };

      const handleSubmitExpense = async (e) => {
        e.preventDefault();
        if (!formKeterangan.trim() || !formJumlah) return;

        setIsSubmitting(true);
        try {
          await onSaveExpense({
            ID: editingExpenseId || undefined,
            KETERANGAN: formKeterangan.trim(),
            JUMLAH: Number(formJumlah),
            TANGGAL: new Date().toISOString(),
          });
          handleResetExpense();
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleDownloadPDF = () => {

        if (!printWindow) {
          alert('Mohon izinkan pop-up browser untuk mengunduh/mencetak laporan PDF.');

        const htmlContent = `

                  displaySales.map(s => `
                    <tr>

    function App() {
      const [currentPage, setCurrentPage] = useState('katalog');
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
      
      const [products, setProducts] = useState([]);
      const [sales, setSales] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [reviews, setReviews] = useState([]);

      const [isLoading, setIsLoading] = useState(true);
      const [toast, setToast] = useState(null);

      const [receiptSale, setReceiptSale] = useState(null);
      const [confirmConfig, setConfirmConfig] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Muat data publik (produk + ulasan) saat pertama kali.
      // Jaminan produk selalu muncul di semua browser/HP:
      //   1. Cache ditampilkan INSTAN jika tersedia (tanpa loading sama sekali)
      //   2. API dipanggil di background untuk memperbarui data
      //   3. Jika API gagal total, produk dari cache tetap terlihat
      //   4. isLoading hanya true jika benar-benar belum ada data sama sekali
      const loadPublicData = async (isBackground = false) => {
        // Jangan gunakan get() untuk katalog utama: TTL hanya menentukan
        // kapan refresh dilakukan, bukan kapan produk lama boleh dihapus.
        const cachedP = SmartCache.getStale('produk');
        const cachedR = SmartCache.getStale('review');
        // Cache ulasan tidak boleh menghentikan skeleton katalog. Pada mobile
        // hal ini bisa membuat katalog langsung terlihat kosong saat request
        // produk gagal atau deployment Apps Script masih versi lama.
        let productReady = Array.isArray(cachedP) || products.length > 0;

        if (!isBackground) {
          // Tampilkan cache segera — jangan tunda render karena menunggu API
          if (cachedP) setProducts(cachedP);
          if (cachedR) setReviews(cachedR);
          // Hanya hentikan skeleton jika produk memang sudah tersedia
          setIsLoading(!productReady);
        }

        try {
          // Kirim kedua request bersamaan. Promise.all + catch lokal lebih
          // kompatibel dengan Safari/Android WebView lama daripada
          // Promise.allSettled, dan satu request gagal tidak membatalkan yang lain.
          const [resP, resR] = await Promise.all([
            gasCall('getPublicProduk').then(
              (value) => ({ status: 'fulfilled', value }),
              (reason) => ({ status: 'rejected', reason })
            ),
            gasCall('getReview').then(
              (value) => ({ status: 'fulfilled', value }),
              (reason) => ({ status: 'rejected', reason })
            ),
          ]);

          // Produk
          if (
            resP.status === 'fulfilled' &&
            resP.value &&
            Array.isArray(resP.value.data)
          ) {
            // Termasuk []: cache lama harus ikut dikosongkan jika katalog
            // memang sudah kosong di Spreadsheet.
            setProducts(resP.value.data);
            SmartCache.set('produk', resP.value.data);
            productReady = true;
          } else if (resP.status === 'rejected' || !resP.value?.data) {
            // API gagal — pertahankan cache yang sudah ditampilkan
            console.warn('getPublicProduk gagal, menampilkan cache:', resP.reason || resP.value?.message);
          }

          // Ulasan
          if (resR.status === 'fulfilled' && resR.value?.data) {
            setReviews(resR.value.data);
            SmartCache.set('review', resR.value.data);
          }
        } catch (e) {
          console.error('Error loading public data:', e);
          // Produk dari cache tetap tampil — tidak perlu panic
        } finally {
          // Jangan tampilkan “Tidak ada produk” hanya karena API gagal.
          // Tetap tampilkan skeleton agar retry berikutnya dapat memulihkan
          // katalog, terutama pada koneksi mobile yang lambat/intermiten.
          setIsLoading(!productReady);
        }
      };

      // Muat data admin (penjualan + pengeluaran) hanya saat admin login
      const loadAdminData = async () => {
        const cachedS = SmartCache.get('penjualan');
        const cachedE = SmartCache.get('pengeluaran');
        if (cachedS) setSales(cachedS);
        if (cachedE) setExpenses(cachedE);
        try {
          const [resS, resE] = await Promise.all([
            gasCall('getPenjualan'),
            gasCall('getPengeluaran'),
          ]);
          if (resS && resS.data) { setSales(resS.data); SmartCache.set('penjualan', resS.data); }
          if (resE && resE.data) { setExpenses(resE.data); SmartCache.set('pengeluaran', resE.data); }
        } catch (e) {
          console.error('Error loading admin data:', e);
        }
      };

      // loadInitialData dipertahankan untuk kompatibilitas refresh background
      const loadInitialData = async (isBackground = false) => {
        await loadPublicData(isBackground);
        if (isAdminLoggedIn) await loadAdminData();
      };

      useEffect(() => {
        loadPublicData(false);
        const handleOnline = () => loadPublicData(true);
        // Coba ulang berkala agar halaman baru pulih sendiri jika request
        // pertama terjadi saat Apps Script/Google sedang lambat.
        const retryTimer = window.setInterval(() => {
          if (navigator.onLine !== false) loadPublicData(true);
        }, 30000);
        window.addEventListener('online', handleOnline);
        return () => {
          window.clearInterval(retryTimer);
          window.removeEventListener('online', handleOnline);
        };
      }, []);

      const handleSaveProduct = async (p) => {
        const res = await gasCall('saveProduk', p);
        if (res && res.data) {
          setProducts(res.data);
          SmartCache.set('produk', res.data);
          showToast('Produk berhasil disimpan!');
          return true;
        } else {
          showToast(res?.message || 'Gagal menyimpan produk', 'error');
          return false;
        }
      };

      const handleDeleteProduct = (id) => {
        setConfirmConfig({
          isOpen: true,
          title: 'Hapus Produk',
          message: 'Apakah Anda yakin ingin menghapus produk ini?',
          onConfirm: async () => {
            setConfirmConfig(null);
            const res = await gasCall('deleteProduk', { ID: id });
            if (res && res.data) {
              setProducts(res.data);
              SmartCache.set('produk', res.data);
              showToast('Produk berhasil dihapus');
            } else {
              showToast('Gagal menghapus produk', 'error');
            }
          },
        });
      };

      const handleSaveSale = async (s) => {
        const res = await gasCall('savePenjualan', s);
        if (res && res.data) {
          setSales(res.data);
          SmartCache.set('penjualan', res.data);
          showToast('Transaksi berhasil disimpan!');
          const savedItem = res.data.find((x) => x.NAMA_PEMBELI === s.NAMA_PEMBELI && x.HARGA === s.HARGA) || s;
          return savedItem;
        } else {
          showToast(res?.message || 'Gagal menyimpan transaksi', 'error');
          return null;
        }
      };

      const handleDeleteSale = (id) => {
        setConfirmConfig({
          isOpen: true,
          title: 'Hapus Transaksi',
          message: 'Apakah Anda yakin ingin menghapus data transaksi ini?',
          onConfirm: async () => {
            setConfirmConfig(null);
            const res = await gasCall('deletePenjualan', { ID: id });
            if (res && res.data) {
              setSales(res.data);
              SmartCache.set('penjualan', res.data);
              showToast('Transaksi berhasil dihapus');
            } else {
              showToast('Gagal menghapus transaksi', 'error');
            }
          },
        });
      };

      const handleSaveExpense = async (e) => {
        const res = await gasCall('savePengeluaran', e);
        if (res && res.data) {
          setExpenses(res.data);
          SmartCache.set('pengeluaran', res.data);
          showToast('Pengeluaran berhasil dicatat!');
          return true;
        } else {
          showToast(res?.message || 'Gagal mencatat pengeluaran', 'error');
          return false;
        }
      };

      const handleDeleteExpense = (id) => {
        setConfirmConfig({
          isOpen: true,
          title: 'Hapus Pengeluaran',
          message: 'Apakah Anda yakin ingin menghapus data pengeluaran ini?',
          onConfirm: async () => {
            setConfirmConfig(null);
            const res = await gasCall('deletePengeluaran', { ID: id });
            if (res && res.data) {
              setExpenses(res.data);
              SmartCache.set('pengeluaran', res.data);
              showToast('Pengeluaran berhasil dihapus');
            } else {
              showToast('Gagal menghapus pengeluaran', 'error');
            }
          },
        });
      };

      const handleAddReview = async (r) => {
        const res = await gasCall('addReview', r);
        if (res && res.data) {
          setReviews(res.data);
          SmartCache.set('review', res.data);
          showToast('Terima kasih atas ulasan Anda!');
        } else {
          showToast(res?.message || 'Gagal mengirim ulasan', 'error');
        }
      };

      const handleUpdateReview = async (r) => {
        const res = await gasCall('updateReview', r);
        if (res && res.data) {
          setReviews(res.data);
          SmartCache.set('review', res.data);
          showToast('Ulasan berhasil diperbarui!');
          return true;
        } else {
          showToast(res?.message || 'Gagal memperbarui ulasan', 'error');
          return false;
        }
      };

      const handleDeleteReview = (id) => {
        setConfirmConfig({
          isOpen: true,
          title: 'Hapus Ulasan',
          message: 'Apakah Anda yakin ingin menghapus ulasan ini?',
          onConfirm: async () => {
            setConfirmConfig(null);
            const res = await gasCall('deleteReview', { ID: id });
            if (res && res.data) {
              setReviews(res.data);
              SmartCache.set('review', res.data);
              showToast('Ulasan berhasil dihapus');
            } else {
              showToast('Gagal menghapus ulasan', 'error');
            }
          },
        });
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F5F5F5]">
          <Header
            currentPage={currentPage}
            setCurrentPage={setCurrentPage}
            isAdminLoggedIn={isAdminLoggedIn}
            onOpenLogin={() => setIsLoginModalOpen(true)}
            onLogout={() => {
              setIsAdminLoggedIn(false);
              setCurrentPage('katalog');
              showToast('Logout Admin berhasil');
            }}
          />

          <main className="flex-1 flex flex-col">
            {currentPage === 'katalog' && (
              <KatalogPage products={products} isLoading={isLoading} onReload={() => loadPublicData(false)} />
            )}

            {currentPage === 'ulasan' && (
              <UlasanPage
                reviews={reviews}
                onAddReview={handleAddReview}
                isLoading={isLoading}
              />
            )}

            {currentPage === 'admin' && (
              isAdminLoggedIn ? (
                <AdminDashboard
                  products={products}
                  sales={sales}
                  expenses={expenses}
                  reviews={reviews}
                  onSaveProduct={handleSaveProduct}
                  onDeleteProduct={handleDeleteProduct}
                  onSaveSale={handleSaveSale}
                  onDeleteSale={handleDeleteSale}
                  onSaveExpense={handleSaveExpense}
                  onDeleteExpense={handleDeleteExpense}
                  onDeleteReview={handleDeleteReview}
                  onShowReceipt={(s) => setReceiptSale(s)}
                />
              ) : (
                <div className="max-w-md mx-auto my-12 p-6 bg-white neo-border neo-shadow text-center">
                  <p className="font-extrabold mb-4">Silakan login admin untuk mengakses halaman ini.</p>
                  <button
                    onClick={() => setIsLoginModalOpen(true)}
                    className="bg-[#00E5FF] neo-border neo-shadow px-6 py-2.5 font-extrabold text-xs"
                  >
                    Login Admin Sekarang
                  </button>
                </div>
              )
            )}
          </main>

          <Footer />

          <AdminLogin
            isOpen={isLoginModalOpen}
            onClose={() => setIsLoginModalOpen(false)}
            onLoginSuccess={() => {
              setIsAdminLoggedIn(true);
              setCurrentPage('admin');
              loadAdminData();
            }}
            showToast={showToast}
          />

          <StrukModal
            isOpen={!!receiptSale}
            sale={receiptSale}
            onClose={() => setReceiptSale(null)}
          />

          <ConfirmModal
            isOpen={!!confirmConfig?.isOpen}
            title={confirmConfig?.title}
            message={confirmConfig?.message}
            onConfirm={confirmConfig?.onConfirm}
            onCancel={() => setConfirmConfig(null)}
          />

          <Toast toast={toast} />
        </div>
      );
    }

    if (window.__dwisyaCdnGuardTimer) {
      clearTimeout(window.__dwisyaCdnGuardTimer);
    }
    if (!window.React || !window.ReactDOM) {
      console.error('[CDN] React/ReactDOM belum tersedia; aplikasi tidak dijalankan.');
      document.getElementById('root').innerHTML =
        '<div style="max-width:560px;margin:48px auto;padding:24px;font-family:Arial,sans-serif;' +
        'border:2px solid #1d4ed8;background:#fff;text-align:center;color:#1e3a5f">' +
        '<h1 style="margin:0 0 12px;font-size:22px">Gagal Memuat Halaman</h1>' +
        '<p style="margin:0 0 18px;line-height:1.5">Library tampilan belum tersedia. ' +
        'Silakan periksa koneksi internet dan muat ulang halaman.</p>' +
        '<button onclick="location.reload()" style="padding:10px 16px;border:2px solid #1d4ed8;' +
        'background:#2563eb;color:#fff;font-weight:700;cursor:pointer">Muat Ulang</button>' +
        '</div>';
    } else {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
  </script>
</body>
</html>
